plugins {
     id 'com.android.application'
     id 'org.jetbrains.kotlin.android'
     id 'org.jetbrains.kotlin.plugin.compose'
}

def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE');
def releaseKeystore = System.getenv('SKATE3_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('SKATE3_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SKATE3_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SKATE3_RELEASE_KEY_PASSWORD')

android {
    namespace = "io.skate3port.game"
    compileSdkVersion 35
    ndkVersion = "27.2.12479018"
    signingConfigs {
        if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "io.skate3port.game"
        minSdkVersion 33
        targetSdkVersion 35
        versionCode 10200
        versionName "1.2.0"
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-debug"
        }
        qa {
            initWith debug
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa7"
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug"]
        }
        release {
            minifyEnabled false
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    sourceSets.main { jniLibs.srcDir 'libs' }
    packagingOptions {
        jniLibs {
            // AdrenoTools needs extracted hook libraries in nativeLibraryDir.
            useLegacyPackaging true
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.ui:ui-tooling-preview'
}
